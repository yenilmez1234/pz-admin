name: Generate macOS icons (one-time)

# Remove this workflow after downloading and committing the generated assets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install the project's Wails CLI version
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16

      - name: Compile Icon Composer assets
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          mkdir -p "$RUNNER_TEMP/pz-admin-macos-assets"
          # Empty input disables Wails' PNG fallback: compilation must succeed.
          # Use a fresh output directory so tracked assets cannot mask failure.
          wails3 generate icons \
            -input "" \
            -iconcomposerinput build/appicon.icon \
            -macassetdir "$RUNNER_TEMP/pz-admin-macos-assets"
          test -s "$RUNNER_TEMP/pz-admin-macos-assets/Assets.car"
          test -s "$RUNNER_TEMP/pz-admin-macos-assets/icons.icns"

      - name: Upload generated assets
        uses: actions/upload-artifact@v6
        with:
          name: pz-admin-macos-icons
          path: |
            ${{ runner.temp }}/pz-admin-macos-assets/Assets.car
            ${{ runner.temp }}/pz-admin-macos-assets/icons.icns
          if-no-files-found: error
          retention-days: 14
