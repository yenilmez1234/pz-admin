version: '3'

vars:
  APP_NAME: "pz-admin"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  check:
    desc: Checks the backend and frontend
    cmds:
      - task: check:backend
      - task: check:frontend

  check:backend:
    desc: Checks and tests the Go backend
    cmds:
      - go vet ./...
      - task: test:backend

  check:frontend:
    desc: Checks and tests the frontend
    dir: frontend
    cmds:
      - pnpm check

  format:
    desc: Formats the backend and frontend
    deps:
      - task: format:backend
      - task: format:frontend

  format:backend:
    desc: Formats the Go backend
    cmds:
      - go fmt ./...

  format:frontend:
    desc: Formats the frontend
    dir: frontend
    cmds:
      - pnpm format

  test:
    desc: Tests the backend and frontend
    cmds:
      - task: test:backend
      - task: test:frontend

  test:backend:
    desc: Tests the Go backend
    cmds:
      - go test ./...

  test:frontend:
    desc: Tests the frontend
    dir: frontend
    cmds:
      - pnpm test:run

  version:set:
    summary: Sets the application version and regenerates platform metadata
    requires:
      vars: [VERSION]
    cmds:
      - node ./scripts/sync-version.mjs "{{.VERSION}}"
      - task: common:update:build-assets

  version:sync:
    summary: Regenerates platform metadata from the VERSION file
    cmds:
      - node ./scripts/sync-version.mjs
      - task: common:update:build-assets

  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
