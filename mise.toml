[settings]
lockfile = true

[tools]
"go:github.com/google/go-licenses/v2" = "latest"
# Keep the CLI aligned with the Wails dependency in go.mod.
"go:github.com/wailsapp/wails/v3/cmd/wails3" = "{{ read_file(path=config_root ~ '/go.mod') | regex_replace(pattern='(?s)^.*?github[.]com/wailsapp/wails/v3[[:space:]]+(v[^[:space:]]+).*$', rep='$1') }}"
"pipx:reuse" = "latest"
go = "1.26"
node = "24"
pnpm = "latest"
