version = 1

# Original application code and configuration.
[[annotations]]
path = [
  ".gitignore",
  "VERSION",
  "frontend/.*",
  "frontend/*.cjs",
  "frontend/*.json",
  "frontend/*.ts",
  "frontend/*.yaml",
  "frontend/index.html",
  "frontend/scripts/**",
  "frontend/src/**",
  "go.mod",
  "go.sum",
  "internal/**",
  "main.go",
  "mise.lock",
  "mise.toml",
  "scripts/**",
  "skills-lock.json",
]
SPDX-FileCopyrightText = "2026 Bedirhan Yenilmez"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Original icon artwork and platform exports.
[[annotations]]
path = [
  "build/appicon.icon/**",
  "build/appicon.png",
  "build/appicon.svg",
  "build/darwin/Assets.car",
  "build/darwin/icons.icns",
  "build/linux/icons/**",
  "build/windows/icon.ico",
]
SPDX-FileCopyrightText = "2026 Bedirhan Yenilmez"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# AppStream metadata, licensed separately for redistribution by software catalogs.
[[annotations]]
path = "build/linux/com.bedirhanyenilmez.pzadmin.metainfo.xml"
SPDX-FileCopyrightText = "2026 Bedirhan Yenilmez"
SPDX-License-Identifier = "MIT"

# Adapted Tailscale code; upstream notices are retained alongside it.
[[annotations]]
path = ["internal/third_party/tailscale.com/**"]
SPDX-FileCopyrightText = "2020 Tailscale Inc & contributors"
SPDX-License-Identifier = "BSD-3-Clause"

# Written for this project, not copied from Tailscale.
[[annotations]]
path = "internal/third_party/tailscale.com/atomicfile/atomicfile_test.go"
SPDX-FileCopyrightText = "2026 Bedirhan Yenilmez"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Prevent new imported data from inheriting GPL before provenance review.
[[annotations]]
path = "frontend/src/data/**"

# Wiki-derived skill information, structured for this application.
[[annotations]]
path = "frontend/src/data/skills/*.json"
SPDX-FileCopyrightText = ["PZwiki contributors", "2026 Bedirhan Yenilmez"]
SPDX-License-Identifier = "CC-BY-NC-SA-3.0"

# CC BY-NC-SA covers wiki material and our adaptations; game material retains
# The Indie Stone's terms. Stats also include in-game observations and corrections.
[[annotations]]
path = [
  "frontend/public/vehicles/**/stats.json",
  "frontend/src/data/items/*.json",
  "frontend/src/data/vehicles/*.json",
]
SPDX-FileCopyrightText = [
  "PZwiki contributors",
  "The Indie Stone",
  "2026 Bedirhan Yenilmez",
]
SPDX-License-Identifier = "CC-BY-NC-SA-3.0 AND LicenseRef-Project-Zomboid-Terms-and-Conditions"

# Game-extracted item and skill translations, item and skill images, vehicle
# renders and stat icons; artwork obtained through the wiki is game-derived.
[[annotations]]
path = [
  "frontend/public/items/**/*.png",
  "frontend/public/skills/**/*.png",
  "frontend/public/vehicles/**/*.png",
  "frontend/src/data/items/locales/**",
  "frontend/src/data/skills/locales/**",
]
SPDX-FileCopyrightText = "The Indie Stone"
SPDX-License-Identifier = "LicenseRef-Project-Zomboid-Terms-and-Conditions"
